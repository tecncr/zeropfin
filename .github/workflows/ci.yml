name: CI

on:
  push:
    branches: [master]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

permissions:
  contents: read

env:
  # Patched ZeroPlay bundled in the .deb: tecncr/zeroplay, branch
  # feat/control-status-events (control-mode status extensions, docs/adr/0002).
  ZEROPLAY_REPO: tecncr/zeroplay
  ZEROPLAY_REF: 49a8ca4f180610644cec3f3f40c4239217fd8652

jobs:
  host:
    name: Host build, tests, web, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libmicrohttpd-dev libcurl4-openssl-dev libcjson-dev cppcheck python3-venv

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web — install, unit tests, build, design check
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm check:design

      - name: Format and static analysis
        run: |
          python3 -m venv /tmp/fmt && /tmp/fmt/bin/pip install -q clang-format==23.1.5
          /tmp/fmt/bin/clang-format --dry-run --Werror src/*.c src/*.h tests/*.h tests/unit/*.c tests/mock_zeroplay/*.c
          cppcheck --enable=warning,performance,portability --inline-suppr --error-exitcode=1 -q --std=c11 \
            -D_GNU_SOURCE -Isrc src tests/mock_zeroplay

      - name: Native — ASan/UBSan build and all tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DZF_SANITIZE=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Native — release build, tests (incl. relay memory bound)
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel
          ctest --test-dir build-rel --output-on-failure

      - name: Browser e2e (Chromium, iPhone + desktop viewports)
        working-directory: web
        env:
          CHROMIUM: /usr/bin/google-chrome
          ZEROPFIN_BUILD: ../build-rel
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: host-evidence
          path: |
            screenshots/
            web/dist/build-report.json
          if-no-files-found: warn

  armv6:
    name: ARMv6 build, .deb bundling ZeroPlay, install test, release bundle
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ZEROPLAY_REPO }}
          ref: ${{ env.ZEROPLAY_REF }}
          path: zeroplay-src
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web bundle
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Version metadata
        run: |
          echo "ZF_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "ZF_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
      - name: Build in Raspbian container, all tests on emulated ARM1176, .deb, install test
        env:
          CONTAINER_ENGINE: docker
          ZEROPLAY_COMMIT: ${{ env.ZEROPLAY_REF }}
        run: scripts/build-armv6.sh --test --zeroplay zeroplay-src --package --install-test
      - name: Release bundle (zip with .deb + setup.sh) and content checks
        run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeropfin-armhf
          path: |
            dist/zeropfin-*-armhf.zip
            dist/zeropfin_*_armhf.deb
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: armv6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zeropfin-armhf
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          [ -f "$notes" ] || { echo "missing release notes $notes" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Zeropfin ${version}" \
            --notes-file "$notes" dist/zeropfin-*-armhf.zip dist/zeropfin_*_armhf.deb dist/SHA256SUMS
