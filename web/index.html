<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Zeropfin" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Zeropfin</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="min-h-dvh">
    <svg class="hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.1-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5h3.2a.8.8 0 0 1 .8.8v13.4a.8.8 0 0 1-.8.8H7a.8.8 0 0 1-.8-.8V5.3a.8.8 0 0 1 .8-.8zm6.8 0H17a.8.8 0 0 1 .8.8v13.4a.8.8 0 0 1-.8.8h-3.2a.8.8 0 0 1-.8-.8V5.3a.8.8 0 0 1 .8-.8z" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.34-5.66M4 4v4h4" /></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h2v14H6zM19 5.9v12.2a.9.9 0 0 1-1.38.76L9.5 13.8a.9.9 0 0 1 0-1.52l8.12-5.14A.9.9 0 0 1 19 5.9z" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M16 5h2v14h-2zM5 5.9v12.2a.9.9 0 0 0 1.38.76l8.12-5.06a.9.9 0 0 0 0-1.52L6.38 7.14A.9.9 0 0 0 5 5.9z" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15zM16 16l5 5" /></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 8v5m0 3.5v.01M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z" /></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M4 5h16v14H4zM8 5v14m8-14v14M4 9h4m-4 6h4m8-6h4m-4 6h4" /></symbol>
    </svg>

    <div x-data="shell" x-cloak>
      <!-- Receiver unreachable -->
      <div x-show="!$store.app.online" role="alert"
        class="fixed inset-x-0 top-0 z-50 border-b border-neutral-800 bg-neutral-950 px-4 pt-[env(safe-area-inset-top)] text-center text-sm text-neutral-300">
        <p class="py-2">Can’t reach the receiver. Retrying…</p>
      </div>

      <!-- Booting -->
      <template x-if="$store.app.boot === 'loading'">
        <div class="flex min-h-dvh items-center justify-center">
          <span class="text-sm font-medium tracking-tight text-neutral-500">Zeropfin</span>
        </div>
      </template>

      <!-- Pairing -->
      <template x-if="$store.app.boot === 'ready' && !$store.app.authed">
        <main x-data="pairing" class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-6 pb-[env(safe-area-inset-bottom)]">
          <h1 class="text-2xl font-semibold tracking-tight">Zeropfin</h1>
          <form class="mt-8" x-on:submit.prevent="submit">
            <label for="pair-code" class="text-sm font-medium text-neutral-300">Pairing code</label>
            <input id="pair-code" name="code" inputmode="text" autocomplete="one-time-code" autocapitalize="characters"
              spellcheck="false" placeholder="XXXX-XXXX" maxlength="9" x-on:input="onInput"
              class="tnum mt-2 block h-14 w-full rounded-lg border border-neutral-800 bg-neutral-950 px-4 text-center font-mono text-2xl tracking-[0.2em] text-white placeholder:text-neutral-700 focus:border-blue-500 focus:outline-none" />
            <p class="mt-3 text-sm text-neutral-500">Run <code class="rounded bg-neutral-900 px-1.5 py-0.5 text-neutral-300">zeropfin pair</code> on the receiver, or show a code on the TV.</p>
            <p x-show="error" x-text="error" role="alert" class="mt-3 text-sm text-white"></p>
            <p x-show="info" x-text="info" role="status" class="mt-3 text-sm text-neutral-300"></p>
            <button type="submit" x-bind:disabled="!complete || busy"
              class="mt-6 h-12 w-full rounded-lg bg-blue-600 font-medium text-white hover:bg-blue-500 disabled:bg-neutral-800 disabled:text-neutral-500">Pair</button>
            <button type="button" x-show="$store.app.pairingOnDisplay" x-on:click="showOnTv"
              class="mt-3 h-12 w-full rounded-lg border border-neutral-800 font-medium text-neutral-200 hover:border-neutral-600">Show code on TV</button>
          </form>
        </main>
      </template>

      <!-- App -->
      <template x-if="$store.app.authed">
        <div>
          <header class="sticky top-0 z-30 border-b border-neutral-900 bg-black pt-[env(safe-area-inset-top)]">
            <nav class="mx-auto flex h-14 max-w-7xl items-center gap-3 px-4" aria-label="Main">
              <a href="#/" class="mr-1 shrink-0 text-[17px] font-semibold tracking-tight text-white">Zeropfin</a>
              <div class="hidden items-center gap-1 sm:flex">
                <template x-for="v in $store.app.views" :key="v.id">
                  <a :href="'#/library/' + v.id" x-text="v.name"
                    :class="$store.app.route.params.id === v.id ? 'text-white bg-neutral-900' : 'text-neutral-400 hover:text-white'"
                    class="rounded-md px-3 py-1.5 text-sm font-medium"></a>
                </template>
              </div>
              <form x-data="searchBox" role="search" class="ml-auto flex items-center" x-on:submit.prevent="go">
                <label for="search-input" class="sr-only">Search</label>
                <div class="relative">
                  <svg class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-neutral-500" aria-hidden="true"><use href="#i-search" /></svg>
                  <input id="search-input" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search"
                    :value="q" x-on:input="onInput"
                    class="h-10 w-40 rounded-lg border border-neutral-800 bg-neutral-950 pr-3 pl-9 text-[15px] text-white placeholder:text-neutral-500 focus:w-56 focus:border-blue-500 focus:outline-none sm:w-56" />
                </div>
              </form>
            </nav>
            <div class="flex gap-1 overflow-x-auto px-4 pb-2 sm:hidden" x-show="$store.app.views.length">
              <a href="#/" :class="$store.app.route.name === 'home' ? 'bg-white text-black' : 'border border-neutral-800 text-neutral-300'"
                class="shrink-0 rounded-full px-3.5 py-1.5 text-sm font-medium">Home</a>
              <template x-for="v in $store.app.views" :key="v.id">
                <a :href="'#/library/' + v.id" x-text="v.name"
                  :class="$store.app.route.params.id === v.id ? 'bg-white text-black' : 'border border-neutral-800 text-neutral-300'"
                  class="shrink-0 rounded-full px-3.5 py-1.5 text-sm font-medium"></a>
              </template>
            </div>
          </header>

          <main class="mx-auto max-w-7xl px-4 pt-5 pb-36">
            <template x-for="r in [$store.app.route]" :key="r.key">
              <div>
                <!-- Not configured -->
                <template x-if="$store.app.status && !$store.app.status.jellyfin.configured">
                  <section class="mx-auto max-w-md rounded-xl border border-neutral-800 p-6">
                    <h1 class="text-lg font-semibold">Jellyfin isn’t set up</h1>
                    <p class="mt-2 text-sm text-neutral-400">Sign in once from an SSH session on the receiver:</p>
                    <pre class="mt-3 overflow-x-auto rounded-lg bg-neutral-950 p-3 text-sm text-neutral-200"><code>sudo -u zeropfin zeropfin setup</code></pre>
                  </section>
                </template>

                <!-- Home -->
                <template x-if="r.name === 'home' && $store.app.status && $store.app.status.jellyfin.configured">
                  <div x-data="home" class="space-y-9">
                    <template x-if="loading">
                      <div class="space-y-3" aria-hidden="true">
                        <div class="h-4 w-40 rounded bg-neutral-900"></div>
                        <div class="flex gap-3"><div class="aspect-video w-64 rounded-lg bg-neutral-900"></div><div class="aspect-video w-64 rounded-lg bg-neutral-900"></div></div>
                      </div>
                    </template>
                    <p x-show="error" x-text="error" role="alert" class="text-sm text-neutral-300"></p>

                    <section x-show="resume.length" aria-labelledby="h-resume">
                      <h2 id="h-resume" class="mb-3 text-[17px] font-semibold tracking-tight">Continue watching</h2>
                      <div class="scroll-row">
                        <template x-for="it in resume" :key="it.id">
                          <a :href="itemHref(it)" class="w-64 shrink-0 snap-start sm:w-72">
                            <div class="relative aspect-video overflow-hidden rounded-lg bg-neutral-900">
                              <img x-show="it.thumb || it.backdrop" :src="img(it.thumb || it.backdrop, 288)" alt="" loading="lazy" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                              <div class="absolute inset-x-0 bottom-0 h-1 bg-neutral-800"><div class="h-full bg-blue-500" :style="{ width: progressPct(it) + '%' }"></div></div>
                            </div>
                            <p class="mt-2 truncate text-sm font-medium" x-text="it.seriesName || it.name"></p>
                            <p class="truncate text-[13px] text-neutral-500" x-text="it.seriesName ? epCode(it) + ' · ' + it.name : meta(it)"></p>
                          </a>
                        </template>
                      </div>
                    </section>

                    <section x-show="nextUp.length" aria-labelledby="h-next">
                      <h2 id="h-next" class="mb-3 text-[17px] font-semibold tracking-tight">Next up</h2>
                      <div class="scroll-row">
                        <template x-for="it in nextUp" :key="it.id">
                          <a :href="itemHref(it)" class="w-64 shrink-0 snap-start sm:w-72">
                            <div class="aspect-video overflow-hidden rounded-lg bg-neutral-900">
                              <img x-show="it.thumb" :src="img(it.thumb, 288)" alt="" loading="lazy" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                            </div>
                            <p class="mt-2 truncate text-sm font-medium" x-text="it.seriesName"></p>
                            <p class="truncate text-[13px] text-neutral-500" x-text="epCode(it) + ' · ' + it.name"></p>
                          </a>
                        </template>
                      </div>
                    </section>

                    <template x-for="row in latest" :key="row.view.id">
                      <section>
                        <div class="mb-3 flex items-baseline justify-between">
                          <h2 class="text-[17px] font-semibold tracking-tight" x-text="row.view.name"></h2>
                          <a :href="libraryHref(row.view)" class="rounded px-1 text-sm font-medium text-blue-400 hover:text-blue-300">See all</a>
                        </div>
                        <div class="scroll-row">
                          <template x-for="it in row.items" :key="it.id">
                            <a :href="itemHref(it)" class="w-32 shrink-0 snap-start sm:w-36">
                              <div class="aspect-[2/3] overflow-hidden rounded-lg bg-neutral-900">
                                <img x-show="it.poster" :src="img(it.poster, 144)" alt="" loading="lazy" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                              </div>
                              <p class="mt-2 truncate text-sm font-medium" x-text="it.name"></p>
                              <p class="truncate text-[13px] text-neutral-500" x-text="it.year || ''"></p>
                            </a>
                          </template>
                        </div>
                      </section>
                    </template>

                    <div x-show="empty" class="py-20 text-center text-neutral-500">
                      <svg class="mx-auto size-10 text-neutral-700" aria-hidden="true"><use href="#i-film" /></svg>
                      <p class="mt-3 text-sm">No video libraries yet.</p>
                    </div>
                  </div>
                </template>

                <!-- Library -->
                <template x-if="r.name === 'library'">
                  <section x-data="library" aria-labelledby="h-lib">
                    <div class="mb-5 flex flex-wrap items-center gap-3">
                      <h1 id="h-lib" class="mr-auto text-2xl font-semibold tracking-tight" x-text="title"></h1>
                      <label class="sr-only" for="lib-sort">Sort by</label>
                      <select id="lib-sort" x-on:change="setSort" class="h-10 rounded-lg border border-neutral-800 bg-neutral-950 px-3 text-sm text-neutral-200 focus:border-blue-500 focus:outline-none">
                        <template x-for="s in sorts" :key="s.id">
                          <option :value="s.id" x-text="s.label" :selected="s.id === sort"></option>
                        </template>
                      </select>
                      <button type="button" x-on:click="toggleUnplayed" :aria-pressed="unplayed ? 'true' : 'false'"
                        :class="unplayed ? 'border-blue-500 bg-blue-600 text-white' : 'border-neutral-800 text-neutral-300 hover:border-neutral-600'"
                        class="h-10 rounded-lg border px-3.5 text-sm font-medium">Unplayed</button>
                    </div>
                    <ul class="grid grid-cols-3 gap-x-3 gap-y-5 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7">
                      <template x-for="it in items" :key="it.id">
                        <li>
                          <a :href="itemHref(it)" class="group block">
                            <div class="relative aspect-[2/3] overflow-hidden rounded-lg bg-neutral-900 ring-blue-500 group-focus-visible:ring-2">
                              <img x-show="it.poster" :src="img(it.poster, 180)" alt="" loading="lazy" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                              <span x-show="it.played" class="absolute top-1.5 right-1.5 flex size-6 items-center justify-center rounded-full bg-black text-white">
                                <svg class="size-3.5" aria-hidden="true"><use href="#i-check" /></svg><span class="sr-only">Played</span>
                              </span>
                              <div x-show="it.resumeMs" class="absolute inset-x-0 bottom-0 h-1 bg-neutral-800"><div class="h-full bg-blue-500" :style="{ width: progressPct(it) + '%' }"></div></div>
                            </div>
                            <p class="mt-2 truncate text-[13px] font-medium sm:text-sm" x-text="it.name"></p>
                            <p class="truncate text-xs text-neutral-500" x-text="it.year || ''"></p>
                          </a>
                        </li>
                      </template>
                      <template x-for="n in (loading ? [1, 2, 3, 4, 5, 6] : [])" :key="'sk' + n">
                        <li aria-hidden="true"><div class="aspect-[2/3] rounded-lg bg-neutral-900"></div><div class="mt-2 h-3 w-3/4 rounded bg-neutral-900"></div></li>
                      </template>
                    </ul>
                    <p x-show="!loading && total === 0" class="py-16 text-center text-sm text-neutral-500">Nothing here.</p>
                    <div x-show="error" role="alert" class="mt-6 flex items-center justify-center gap-3 text-sm text-neutral-300">
                      <span x-text="error"></span>
                      <button type="button" x-on:click="load(false)" class="rounded-lg border border-neutral-700 px-3 py-1.5 font-medium">Retry</button>
                    </div>
                    <div x-ref="sentinel" class="h-px"></div>
                  </section>
                </template>

                <!-- Search -->
                <template x-if="r.name === 'search'">
                  <section x-data="search" aria-labelledby="h-search">
                    <h1 id="h-search" class="mb-5 text-2xl font-semibold tracking-tight" x-text="q ? 'Results for “' + q + '”' : 'Search'"></h1>
                    <p x-show="loading" class="text-sm text-neutral-500">Searching…</p>
                    <p x-show="error" x-text="error" role="alert" class="text-sm text-neutral-300"></p>
                    <p x-show="searched && !loading && !error && !items.length" class="py-16 text-center text-sm text-neutral-500">No matches.</p>
                    <ul class="grid grid-cols-3 gap-x-3 gap-y-5 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7">
                      <template x-for="it in items" :key="it.id">
                        <li>
                          <a :href="itemHref(it)" class="block">
                            <div class="aspect-[2/3] overflow-hidden rounded-lg bg-neutral-900">
                              <img x-show="it.poster" :src="img(it.poster, 180)" alt="" loading="lazy" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                            </div>
                            <p class="mt-2 truncate text-[13px] font-medium sm:text-sm" x-text="it.name"></p>
                            <p class="truncate text-xs text-neutral-500" x-text="it.type === 'Episode' ? it.seriesName + ' · ' + epCode(it) : (it.year || '')"></p>
                          </a>
                        </li>
                      </template>
                    </ul>
                  </section>
                </template>

                <!-- Item details -->
                <template x-if="r.name === 'item'">
                  <article x-data="item">
                    <template x-if="loading">
                      <div aria-hidden="true" class="space-y-4"><div class="aspect-video w-full rounded-xl bg-neutral-900 md:max-w-3xl"></div><div class="h-6 w-1/2 rounded bg-neutral-900"></div></div>
                    </template>
                    <p x-show="error" x-text="error" role="alert" class="py-16 text-center text-sm text-neutral-300"></p>
                    <template x-if="item">
                      <div class="md:grid md:grid-cols-[minmax(0,15rem)_minmax(0,1fr)] md:gap-8 lg:grid-cols-[minmax(0,18rem)_minmax(0,1fr)]">
                        <div class="-mx-4 md:mx-0">
                          <div class="aspect-video overflow-hidden bg-neutral-900 md:hidden">
                            <img x-show="item.backdrop || item.thumb" :src="img(item.backdrop || item.thumb, 430)" alt="" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                          </div>
                          <div class="hidden aspect-[2/3] overflow-hidden rounded-xl bg-neutral-900 md:block">
                            <img x-show="item.poster" :src="img(item.poster, 288)" alt="" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                          </div>
                        </div>
                        <div class="min-w-0 pt-5 md:pt-0">
                          <a x-show="item.seriesId" :href="'#/item/' + item.seriesId" class="text-sm font-medium text-neutral-400 hover:text-white" x-text="item.seriesName"></a>
                          <h1 class="text-[26px] leading-tight font-semibold tracking-tight md:text-3xl" x-text="item.name"></h1>
                          <p class="tnum mt-1.5 text-sm text-neutral-400" x-text="facts"></p>
                          <p x-show="genres" class="mt-0.5 text-sm text-neutral-500" x-text="genres"></p>

                          <!-- Playback -->
                          <template x-if="playback">
                            <div class="mt-5">
                              <div x-show="canPlay" class="flex flex-wrap gap-3">
                                <button type="button" x-on:click="play(item.id, true)" x-bind:disabled="busy"
                                  class="inline-flex h-12 items-center gap-2 rounded-lg bg-blue-600 pr-5 pl-4 font-medium text-white hover:bg-blue-500 disabled:bg-neutral-800">
                                  <svg class="size-5" aria-hidden="true"><use href="#i-play" /></svg>
                                  <span x-text="hasResume ? 'Resume ' + clock(item.resumeMs) : 'Play'"></span>
                                </button>
                                <button type="button" x-show="hasResume" x-on:click="play(item.id, false)" x-bind:disabled="busy"
                                  class="h-12 rounded-lg border border-neutral-800 px-5 font-medium text-neutral-200 hover:border-neutral-600">From the start</button>
                              </div>
                              <div x-show="!canPlay" role="note" class="rounded-xl border border-neutral-800 p-4">
                                <p class="flex items-center gap-2 font-medium text-white"><svg class="size-5 text-neutral-400" aria-hidden="true"><use href="#i-alert" /></svg>Can’t play on this receiver</p>
                                <ul class="mt-2 space-y-1 text-sm text-neutral-400">
                                  <template x-for="reason in playback.reasons" :key="reason"><li x-text="reason"></li></template>
                                </ul>
                              </div>
                              <p x-show="mediaLine" class="tnum mt-3 text-[13px] text-neutral-500" x-text="mediaLine"></p>
                              <ul x-show="canPlay && playback.warnings.length" class="mt-1 space-y-0.5 text-[13px] text-neutral-500">
                                <template x-for="w in playback.warnings" :key="w"><li x-text="w"></li></template>
                              </ul>
                            </div>
                          </template>

                          <p x-show="item.overview" class="mt-5 max-w-prose text-[15px] leading-relaxed text-neutral-300" x-text="item.overview"></p>

                          <!-- Series: seasons and episodes -->
                          <template x-if="isSeries">
                            <section class="mt-8" aria-label="Episodes">
                              <div class="scroll-row mx-0! px-0!" role="tablist">
                                <template x-for="s in seasons" :key="s.id">
                                  <button type="button" role="tab" :aria-selected="isSeason(s) ? 'true' : 'false'" x-on:click="selectSeason(s.id)" x-text="s.name"
                                    :class="isSeason(s) ? 'bg-white text-black' : 'border border-neutral-800 text-neutral-300 hover:border-neutral-600'"
                                    class="h-9 shrink-0 rounded-full px-4 text-sm font-medium"></button>
                                </template>
                              </div>
                              <ol class="mt-4 divide-y divide-neutral-900 border-y border-neutral-900">
                                <template x-for="ep in episodes" :key="ep.id">
                                  <li class="flex items-center gap-3 py-3">
                                    <a :href="itemHref(ep)" class="flex min-w-0 flex-1 items-center gap-3">
                                      <div class="relative aspect-video w-28 shrink-0 overflow-hidden rounded-md bg-neutral-900 sm:w-36">
                                        <img x-show="ep.thumb" :src="img(ep.thumb, 144)" alt="" loading="lazy" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                                        <div x-show="ep.resumeMs" class="absolute inset-x-0 bottom-0 h-1 bg-neutral-800"><div class="h-full bg-blue-500" :style="{ width: progressPct(ep) + '%' }"></div></div>
                                      </div>
                                      <div class="min-w-0">
                                        <p class="truncate text-[15px] font-medium"><span class="tnum text-neutral-500" x-text="'E' + ep.index + ' '"></span><span x-text="ep.name"></span></p>
                                        <p class="tnum flex items-center gap-1.5 text-[13px] text-neutral-500">
                                          <span x-text="runtime(ep.runtimeMs)"></span>
                                          <span x-show="ep.played" class="inline-flex items-center gap-1 text-neutral-400"><svg class="size-3.5" aria-hidden="true"><use href="#i-check" /></svg>Played</span>
                                        </p>
                                        <p x-show="ep.overview" class="mt-0.5 line-clamp-2 hidden text-[13px] text-neutral-500 sm:block" x-text="ep.overview"></p>
                                      </div>
                                    </a>
                                    <button type="button" x-on:click="play(ep.id, true)" :aria-label="'Play ' + ep.name"
                                      class="flex size-11 shrink-0 items-center justify-center rounded-full border border-neutral-800 text-white hover:border-neutral-600">
                                      <svg class="size-5" aria-hidden="true"><use href="#i-play" /></svg>
                                    </button>
                                  </li>
                                </template>
                              </ol>
                              <p x-show="episodesLoading" class="py-4 text-sm text-neutral-500">Loading episodes…</p>
                            </section>
                          </template>
                        </div>
                      </div>
                    </template>
                  </article>
                </template>

                <!-- Now playing -->
                <template x-if="r.name === 'now'">
                  <section x-data="nowPlaying" aria-labelledby="h-now" class="mx-auto max-w-4xl">
                    <h1 id="h-now" class="sr-only">Now playing</h1>
                    <template x-if="!hasItem">
                      <div class="py-24 text-center">
                        <p class="text-neutral-400">Nothing is playing.</p>
                        <a href="#/" class="mt-4 inline-block rounded-lg border border-neutral-800 px-4 py-2 text-sm font-medium">Browse</a>
                      </div>
                    </template>
                    <template x-if="hasItem">
                      <div class="md:grid md:grid-cols-[minmax(0,17rem)_minmax(0,1fr)] md:items-center md:gap-10">
                        <div class="mx-auto aspect-[2/3] w-52 overflow-hidden rounded-xl bg-neutral-900 sm:w-60 md:w-full">
                          <img x-show="p.item.poster" :src="img(p.item.poster, 272)" alt="" decoding="async" x-on:error="hideImage" class="size-full object-cover" />
                        </div>
                        <div class="mt-6 md:mt-0">
                          <p class="text-center text-sm font-medium text-neutral-400 md:text-left" x-text="p.item.subtitle"></p>
                          <h2 class="mt-0.5 text-center text-2xl font-semibold tracking-tight md:text-left md:text-3xl" x-text="p.item.title"></h2>
                          <p class="mt-1 h-5 text-center text-sm text-neutral-400 md:text-left" x-text="stateLabel" aria-live="polite"></p>

                          <div x-show="p.error" role="alert" class="mt-3 flex items-start gap-2 rounded-lg border border-neutral-800 p-3 text-sm text-neutral-200">
                            <svg class="mt-px size-5 shrink-0 text-neutral-400" aria-hidden="true"><use href="#i-alert" /></svg><span x-text="p.error"></span>
                          </div>

                          <!-- Seek -->
                          <div class="mt-5">
                            <div class="relative h-7">
                              <div class="absolute inset-x-0 top-1/2 h-1 -translate-y-1/2 rounded-full bg-neutral-800">
                                <div class="h-full rounded-full bg-blue-500" :style="{ width: pct + '%' }"></div>
                              </div>
                              <input type="range" class="seek" min="0" step="1000" aria-label="Seek"
                                :max="duration || 1" :value="position" :disabled="!canControl || !duration"
                                :aria-valuetext="seekLabel" x-on:input="onSeekInput" x-on:change="onSeekChange" />
                            </div>
                            <div class="tnum mt-1 flex justify-between text-[13px] text-neutral-400">
                              <span><span x-show="estimated" class="text-neutral-500">≈ </span><span x-text="clock(position)"></span></span>
                              <span x-show="estimated" class="text-neutral-500">Estimated</span>
                              <span x-text="remaining"></span>
                            </div>
                          </div>

                          <!-- Transport -->
                          <div class="mt-5 flex items-center justify-center gap-4 md:justify-start">
                            <button type="button" x-show="nav.prev || nav.next" x-on:click="playNav(nav.prev)" :disabled="!nav.prev" aria-label="Previous episode"
                              class="flex size-12 items-center justify-center rounded-full text-neutral-300 hover:text-white disabled:text-neutral-700"><svg class="size-6" aria-hidden="true"><use href="#i-prev" /></svg></button>
                            <button type="button" x-on:click="skip(-30000)" :disabled="!canControl" aria-label="Back 30 seconds"
                              class="relative flex size-14 items-center justify-center rounded-full bg-neutral-900 text-white hover:bg-neutral-800 disabled:text-neutral-600">
                              <svg class="size-7" aria-hidden="true"><use href="#i-back" /></svg><span class="tnum absolute text-[10px] font-semibold" aria-hidden="true">30</span>
                            </button>
                            <button type="button" x-on:click="togglePause" :disabled="!canControl" :aria-label="paused ? 'Play' : 'Pause'"
                              class="flex size-[72px] items-center justify-center rounded-full bg-blue-600 text-white hover:bg-blue-500 disabled:bg-neutral-800 disabled:text-neutral-500">
                              <svg x-show="paused" class="size-8" aria-hidden="true"><use href="#i-play" /></svg>
                              <svg x-show="!paused" class="size-8" aria-hidden="true"><use href="#i-pause" /></svg>
                            </button>
                            <button type="button" x-on:click="skip(30000)" :disabled="!canControl" aria-label="Forward 30 seconds"
                              class="relative flex size-14 items-center justify-center rounded-full bg-neutral-900 text-white hover:bg-neutral-800 disabled:text-neutral-600">
                              <svg class="size-7" aria-hidden="true"><use href="#i-fwd" /></svg><span class="tnum absolute text-[10px] font-semibold" aria-hidden="true">30</span>
                            </button>
                            <button type="button" x-show="nav.prev || nav.next" x-on:click="playNav(nav.next)" :disabled="!nav.next" aria-label="Next episode"
                              class="flex size-12 items-center justify-center rounded-full text-neutral-300 hover:text-white disabled:text-neutral-700"><svg class="size-6" aria-hidden="true"><use href="#i-next" /></svg></button>
                          </div>
                          <div class="mt-6 flex justify-center md:justify-start">
                            <button type="button" x-on:click="stop" x-show="active"
                              class="inline-flex h-11 items-center gap-2 rounded-lg border border-neutral-800 px-4 text-sm font-medium text-neutral-200 hover:border-neutral-600">
                              <svg class="size-4" aria-hidden="true"><use href="#i-stop" /></svg>Stop
                            </button>
                            <a x-show="!active" :href="'#/item/' + p.item.id" class="inline-flex h-11 items-center rounded-lg border border-neutral-800 px-4 text-sm font-medium text-neutral-200">Details</a>
                          </div>
                        </div>
                      </div>
                    </template>
                  </section>
                </template>

                <template x-if="r.name === 'notfound'">
                  <div class="py-24 text-center"><p class="text-neutral-400">Page not found.</p><a href="#/" class="mt-4 inline-block text-sm font-medium text-blue-400">Home</a></div>
                </template>
              </div>
            </template>
          </main>

          <!-- Mini player -->
          <div x-data="miniPlayer" x-show="visible" class="fixed inset-x-0 bottom-0 z-40 border-t border-neutral-800 bg-neutral-950 pb-[env(safe-area-inset-bottom)]">
            <div class="h-0.5 bg-neutral-800"><div class="h-full bg-blue-500" :style="{ width: pct + '%' }"></div></div>
            <div class="mx-auto flex h-16 max-w-7xl items-center gap-3 px-4">
              <a href="#/now" class="flex min-w-0 flex-1 items-center gap-3" aria-label="Open now playing">
                <div class="h-12 w-8 shrink-0 overflow-hidden rounded bg-neutral-900">
                  <img x-show="p && p.item && p.item.poster" :src="p && p.item ? img(p.item.poster, 32) : ''" alt="" x-on:error="hideImage" class="size-full object-cover" />
                </div>
                <div class="min-w-0">
                  <p class="truncate text-sm font-medium" x-text="p && p.item ? p.item.title : ''"></p>
                  <p class="tnum truncate text-xs text-neutral-500" x-text="p ? (p.state === 'loading' ? 'Starting…' : clock(p.positionMs)) : ''"></p>
                </div>
              </a>
              <button type="button" x-on:click="togglePause" :aria-label="paused ? 'Play' : 'Pause'"
                class="flex size-11 items-center justify-center rounded-full text-white hover:bg-neutral-900">
                <svg x-show="paused" class="size-6" aria-hidden="true"><use href="#i-play" /></svg>
                <svg x-show="!paused" class="size-6" aria-hidden="true"><use href="#i-pause" /></svg>
              </button>
            </div>
          </div>
        </div>
      </template>

      <!-- Notices -->
      <div class="pointer-events-none fixed inset-x-0 bottom-24 z-50 flex justify-center px-4" role="status" aria-live="polite">
        <p x-show="$store.app.notice" x-text="$store.app.notice ? $store.app.notice.text : ''"
          class="pointer-events-auto max-w-md rounded-lg border border-neutral-700 bg-neutral-900 px-4 py-2.5 text-sm text-white"></p>
      </div>
    </div>
  </body>
</html>
