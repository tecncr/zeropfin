# Zeropfin configuration — /etc/zeropfin/zeropfin.conf
# One "key = value" per line. Unknown keys are errors. Secrets never go here:
# the Jellyfin token lives in /var/lib/zeropfin/credentials.json (see `zeropfin setup`).

# ---- Remote-control web UI (LAN) ----
# "::" listens on all IPv4+IPv6 addresses; use a literal address to restrict.
listen_address = ::
listen_port = 8080
# Only private/link-local clients are served. Extra client networks (CIDR):
#allowed_networks = 203.0.113.0/24
# Host names browsers may use besides IP literals, localhost and <hostname>(.local):
#allowed_hosts = tv.lan
#allow_any_client_address = false     # DANGEROUS: exposes the remote beyond the LAN

# ---- ZeroPlay ----
# The package bundles a ZeroPlay build with the control-mode status extensions.
# Point this at another build (e.g. /usr/local/bin/zeroplay) to use your own.
zeroplay_path = /usr/lib/zeropfin/zeroplay
# Extra ZeroPlay flags (allowlist: --audio-device X, --no-audio, --no-downmixing,
# --vol N, --hls-bitrate N, --verbose). For the analog jack on a Pi 1, e.g.:
#zeroplay_args = --audio-device plughw:CARD=Headphones,DEV=0
#player_ready_timeout_s = 20
#player_load_timeout_s = 45

# ---- Pairing ----
# Show a requested pairing code on the TV (anyone who can see the screen can pair).
pairing_show_on_display = true
session_days = 30

# ---- Direct-play envelope (H.264 only; everything else is refused) ----
max_width = 1920
max_height = 1080
max_fps = 30
max_level = 41
max_bitrate = 12000000
audio_codecs = aac, mp3, ac3, flac, opus
containers = mp4, m4v, mov, mkv

# ---- Jellyfin ----
#device_name = Living room CRT
#jellyfin_ca_file = /etc/zeropfin/jellyfin-ca.pem   # for a self-signed HTTPS server
progress_interval_s = 10
# Report the monotonic position estimate to Jellyfin when ZeroPlay has no status
# events (stock upstream). Positions are never invented when this is false.
report_estimated_position = true

#verbose = false
